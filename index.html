<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadioLinaje - Transmisión en Vivo 24/7</title>
    <meta name="description" content="RadioLinaje - Escucha nuestra transmisión de radio en vivo las 24 horas del día. Música, palabras de fe y comunidad.">
    <meta name="theme-color" content="#ff3b30">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RadioLinaje">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="RadioLinaje - Transmisión en Vivo">
    <meta property="og:description" content="Escucha nuestra transmisión de radio en vivo las 24 horas del día.">
    <meta property="og:image" content="icon-512.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="RadioLinaje - Transmisión en Vivo">
    <meta name="twitter:description" content="Escucha nuestra transmisión de radio en vivo las 24 horas del día.">
    <meta name="twitter:image" content="icon-512.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

    <!-- Enlace a la hoja de estilos -->
    <link rel="stylesheet" href="style.css">

    <!-- Preparación para la PWA -->
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <!-- Puedes reemplazar el texto por una etiqueta <img> con tu logo -->
            <h1>Radio en Vivo</h1>
            <span class="live-badge">🔴 ON AIR</span>
        </header>

        <main class="player-section">
            <div class="track-info">
                <h2 id="station-name">Transmisión Principal</h2>
                <p id="status-text">Listo para reproducir</p>
            </div>

            <!-- El reproductor de audio oculto -->
            <!-- Ahora usa el proxy HTTPS de Cloudflare Workers, no la URL directa -->
            <audio id="audio-stream" src="https://radiolinaje-audio.juansebastianesper.workers.dev/" preload="none"></audio>

            <!-- Controles personalizados -->
            <div class="controls">
                <button id="play-pause-btn" class="control-btn play-mode">
                    <span id="btn-icon">▶</span>
                </button>
            </div>
        </main>
        
        <footer class="footer">
            <p> 2026 - Transmitiendo con el padre, el hijo y su espiritu santo de Dios</p>
        </footer>
    </div>

    <!-- Enlace a la lógica del reproductor -->
    <script src="script.js"></script>
</body>
</html>
